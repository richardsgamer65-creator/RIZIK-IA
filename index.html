
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10111a">
<title>RIZIK AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111a;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;background:#191b29;
 border-bottom:1px solid #303247;
}
h2{margin:0;color:#a99bff}
#status{color:#9b9bad;font-size:12px}
#chat{
 height:calc(100dvh - 155px);
 overflow:auto;padding:16px;
}
.msg{
 padding:13px;margin:10px 0;
 border-radius:14px;max-width:88%;
 line-height:1.5;white-space:pre-wrap;
}
.bot{background:#222538}
.user{background:#5141a0;margin-left:auto}
footer{
 position:fixed;bottom:0;width:100%;
 display:flex;gap:8px;padding:12px;
 background:#191b29;
}
input{
 flex:1;min-width:0;padding:14px;
 border:1px solid #44465d;border-radius:12px;
 background:#10111a;color:white;
}
button{
 padding:12px 17px;border:0;
 border-radius:12px;background:#7864ed;
 color:white;font-weight:bold;
}
</style>
</head>

<body>

<header>
<h2>RIZIK AI 🧠</h2>
<div id="status">Iniciando cérebro...</div>
</header>

<main id="chat"></main>

<footer>
<input id="entrada" placeholder="Converse comigo...">
<button id="enviar">Enviar</button>
</footer>

<script type="module">
import { RizikBrain } from "./brain.js";

const chat=document.getElementById("chat");
const entrada=document.getElementById("entrada");
const status=document.getElementById("status");

function falar(texto,tipo="bot"){
 const div=document.createElement("div");
 div.className="msg "+tipo;
 div.textContent=texto;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function enviar(){
 const texto=entrada.value.trim();
 if(!texto)return;

 falar(texto,"user");
 entrada.value="";

 const resultado=RizikBrain.think(texto);

 if(resultado.handled){
  falar(resultado.text);
 }else{
  falar("Ainda estou aprendendo. Ensine-me usando: ensine: pergunta => resposta");
 }
}

document.getElementById("enviar")
.addEventListener("click",enviar);

entrada.addEventListener("keydown",e=>{
 if(e.key==="Enter")enviar();
});

status.textContent="Cérebro próprio 0.1 conectado";

falar("Olá! Sou a RIZIK AI. Meu primeiro cérebro está funcionando! Vamos evoluir juntos.");
</script>

</body>
</html>
